  <script>
    const I='chapters/';
    const pages=[
      {type:'cover',title:'Portada',image:I+'jerry bridges la busqueda de la santidad.webp'},
      {type:'welcome',title:'Cómo usar este libro'},
      {title:'La búsqueda de la santidad: un llamado para ti',chapter:'Capítulo 1 · Punto de partida',verse:'Sean santos, porque yo soy santo.',image:I+'Capitulo 1 La santidad es para ti.webp',summary:'La santidad es un llamado para la vida cotidiana. Este mapa presenta su significado, los obstáculos más frecuentes y la invitación a caminar con Dios de manera intencional.',question:'¿En qué área concreta de mi vida necesito responder hoy al llamado de Dios?'},
      {title:'La santidad de Dios',chapter:'Capítulo 2 · Fundamento',verse:'Dios es luz, y no hay ningunas tinieblas en Él.',image:I+'Cap 2 La_Santidad_de_Dios.webp',summary:'La santidad comienza en el carácter perfecto de Dios. Él es nuestro estándar supremo y, al mismo tiempo, quien nos llama y capacita para vivir de una manera distinta.',question:'¿Cómo cambia mi manera de vivir cuando recuerdo quién es Dios?'},
      {title:'La santidad no es una opción',chapter:'Capítulo 3 · El llamado',verse:'Hebreos 12:14',image:I+'Capitulo 3 la santidad no es una opción.webp',summary:'La santidad tiene una dimensión recibida en Cristo y otra que se vive mediante decisiones, obediencia y crecimiento. No es perfeccionismo: es una vida que busca parecerse cada día más a Él.',question:'¿Estoy tratando la santidad como una parte esencial de mi fe o como algo opcional?'},
      {title:'La santidad de Cristo',chapter:'Capítulo 4 · Seguridad y ejemplo',verse:'2 Corintios 5:21',image:I+'capitulo 4 Cristo__Seguridad_y_Ejemplo.webp',summary:'En Cristo encontramos refugio y ejemplo. Su obra nos da seguridad delante de Dios, mientras su vida nos muestra cómo se ve la obediencia expresada en acciones, motivos y pensamientos.',question:'¿Qué aspecto del ejemplo de Cristo puedo imitar de forma práctica esta semana?'},
      {title:'Un cambio de reinos: de la esclavitud a la libertad',chapter:'Capítulo 5 · Nueva identidad',verse:'Romanos 6:6–7',image:I+'Capitulo 5 Un_Cambio_de_Reinos.webp',summary:'La unión con Cristo marca un cambio de dominio. Aunque la lucha continúa, ya no enfrentamos el pecado desde la esclavitud, sino desde una nueva identidad y con capacidad de decir no.',question:'¿Estoy tomando decisiones desde mi antigua costumbre o desde mi nueva identidad?'},
      {title:'La batalla por la santidad',chapter:'Capítulo 6 · El enemigo interno',verse:'Romanos 7:21',image:I+'cap 6 La_Batalla_por_la_Santidad.webp',summary:'La lucha también sucede dentro de nosotros. Reconocer los deseos, engaños y hábitos que nos apartan de Dios permite responder con vigilancia, verdad y una defensa espiritual constante.',question:'¿Qué patrón interno necesito reconocer antes de poder enfrentarlo?'},
      {title:'Ayuda en la batalla diaria',chapter:'Capítulo 7 · Viviendo para Dios',verse:'Romanos 6:11',image:I+'Capitulo 7 Ayuda para la lucha diaria.webp',summary:'La vida diaria se sostiene al recordar quiénes somos, depender del Espíritu Santo y usar la Palabra y la oración como recursos vivos, no como simples ideas.',question:'¿Qué recurso espiritual he dejado de usar con constancia?'},
      {title:'Obediencia: el camino a la santidad',chapter:'Capítulo 8 · Decisión diaria',verse:'Obediencia, no victoria',image:I+'Obediencia cap 8 En buqieda de la santidad.webp',summary:'La mirada cambia cuando dejamos de esperar una victoria automática y asumimos la responsabilidad de obedecer. El Espíritu capacita, pero nosotros respondemos con decisiones diarias.',question:'¿Cuál es la siguiente acción obediente que sí está en mis manos?'},
      {title:'Mortificando el pecado',chapter:'Capítulo 9 · Nuestra responsabilidad',verse:'Colosenses 3:5',image:I+'Cap 9 Mortificando_el_pecado_y_santidad.webp',summary:'Mortificar no significa esconder ni justificar el pecado, sino debilitar su influencia mediante convicciones firmes, decisiones concretas y dependencia del Espíritu Santo.',question:'¿Qué decisión específica puedo tomar para dejar de alimentar un hábito dañino?'},
      {title:'El camino de la disciplina personal',chapter:'Capítulo 10 · Cooperación y perseverancia',verse:'1 Timoteo 4:7',image:I+'Cap 10 El_Camino_de_la_Disciplina.webp',summary:'El crecimiento espiritual combina dependencia y esfuerzo. La disciplina forma un ciclo: aprender, practicar, perseverar y permitir que el tiempo consolide nuevos patrones.',question:'¿Qué práctica pequeña puedo repetir con fidelidad durante los próximos siete días?'},
      {title:'Santidad en el cuerpo',chapter:'Capítulo 11 · Disciplina física',verse:'El cuerpo también participa en nuestra obediencia.',image:I+'cap 11 Santidad_y_disciplina_física_cristiana.webp',summary:'La vida espiritual también alcanza nuestros hábitos corporales. Alimentación, descanso, movimiento y dominio propio pueden convertirse en formas concretas de cuidado y gratitud.',question:'¿Qué ajuste sencillo necesita mi cuerpo para acompañar mejor mi vida espiritual?'},
      {title:'Santidad en el Espíritu',chapter:'Capítulo 12 · Purificación interior',verse:'2 Corintios 7:1',image:I+'cap 12 Santidad_en_el_Espíritu.webp',summary:'La batalla de la mente requiere discernir y rechazar tanto los pecados que parecen aceptables como los evidentes. La meta es una vida interior cada vez más limpia y centrada en Dios.',question:'¿Hay algo que he llamado “aceptable” y necesito revisar con honestidad?'},
      {title:'La santidad y nuestra voluntad',chapter:'Capítulo 13 · Guardar el corazón',verse:'Filipenses 2:13',image:I+'Capítulo 13 La_Santidad_y_Nuestra_Voluntad.webp',summary:'La mente, las emociones, la conciencia y la voluntad se relacionan en nuestras decisiones. Guardar el corazón implica orientar pensamientos y afectos hacia la verdad.',question:'¿Qué pensamiento debo examinar antes de convertirlo en una decisión?'},
      {title:'Hábitos de santidad',chapter:'Capítulo 14 · Práctica constante',verse:'Romanos 8:13',image:I+'Capítulo_14__Hábitos_de_santidad.webp',summary:'Los hábitos se forman mediante decisiones repetidas. La reflexión frecuente, evitar excepciones y actuar con diligencia convierten una intención general en una práctica concreta.',question:'¿Qué señal o momento del día puedo usar para recordar mi nuevo hábito?'},
      {title:'Santidad y fe: el camino de la obediencia',chapter:'Capítulo 15 · Fe activa',verse:'Hebreos 11:8',image:I+'Cap 15 Santidad_y_fe__la_obediencia.webp',summary:'La fe verdadera se expresa en obediencia. Como Abraham, caminamos confiando en el carácter de Dios aun cuando no vemos con claridad todo el recorrido.',question:'¿Qué paso de obediencia estoy posponiendo porque todavía no veo el resultado?'},
      {title:'Santidad en un mundo impío',chapter:'Capítulo 16 · Sal y luz',verse:'Juan 17:15',image:I+'capitulo 16 Santidad_en_un_Mundo_Impío.webp',summary:'La respuesta no es el aislamiento, sino una presencia distinta: reconocer influencias, afirmar la identidad en Cristo y vivir con la protección de la Palabra.',question:'¿Cómo puedo ser una influencia sana sin adoptar aquello que quiero transformar?'},
      {title:'La alegría de la santidad',chapter:'Capítulo 17 · El fruto del camino',verse:'La obediencia a Dios conduce al verdadero gozo.',image:I+'Cap 17 El gozo que produce la sntidad.webp',summary:'El gozo no es solo emoción: también nace de la comunión, la obediencia y la esperanza. La santidad no apaga la alegría; la orienta hacia una fuente más profunda y duradera.',question:'¿Dónde he experimentado que obedecer a Dios produce una alegría más estable?'}
    ];
    const book=document.getElementById('book'),counter=document.getElementById('counter'),progressFill=document.getElementById('progressFill'),shortTitle=document.getElementById('shortTitle');
    const prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),tocOverlay=document.getElementById('tocOverlay'),toc=document.getElementById('toc');
    const zoomDialog=document.getElementById('zoomDialog'),zoomImage=document.getElementById('zoomImage'),zoomTitle=document.getElementById('zoomTitle'),zoomStage=document.getElementById('zoomStage');
    let current=0,fontStep=0,zoom=100,speaking=false;
    const icon=name=>({play:'<svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg>',zoom:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M11 8v6M8 11h6"/></svg>',sound:'<svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></svg>'}[name]);
    function cover(){return '<section class="cover-spread"><div class="cover-copy"><div class="kicker">Guía visual interactiva</div><h1>La búsqueda de la santidad</h1><p>Un recorrido sereno para comprender, reflexionar y llevar cada enseñanza a la vida diaria.</p><button class="start" type="button" data-go="1">Comenzar lectura'+icon('play')+'</button></div><div class="cover-art"><img src="'+pages[0].image+'" alt="Portada de La búsqueda de la santidad, de Jerry Bridges"></div></section>'}
    function welcome(){return '<section class="welcome"><div class="welcome-inner"><div class="kicker">Antes de comenzar</div><h1>Lee a tu propio ritmo</h1><p>Las láminas originales permanecen intactas. Este formato añade espacio, una síntesis clara y herramientas sencillas para explorarlas con comodidad.</p><div class="steps"><div class="step"><strong>1. Observa</strong><span>Mira la lámina completa y reconoce su idea central.</span></div><div class="step"><strong>2. Amplía</strong><span>Usa el zoom cuando quieras leer los detalles sin esfuerzo.</span></div><div class="step"><strong>3. Reflexiona</strong><span>Termina cada tema con una pregunta para llevarlo a tu vida.</span></div></div><button class="start" type="button" data-go="2">Ir al primer tema'+icon('play')+'</button></div></section>'}
    function chapter(p,i){return '<section class="spread"><div class="art-page"><div class="art-frame"><img class="art" src="'+p.image+'" alt="Lámina visual: '+p.title+'" data-zoom><button class="zoom-hint" type="button" data-zoom>Ampliar imagen</button></div></div><article class="notes"><div class="chapter-no">'+p.chapter+'</div><h1>'+p.title+'</h1><p class="verse">'+p.verse+'</p><p class="summary">'+p.summary+'</p><div class="reflection"><div class="reflection-card"><div class="reflection-label">Para reflexionar</div><p class="question">'+p.question+'</p></div><div class="page-actions"><button class="action primary" type="button" data-zoom>'+icon('zoom')+' Ver en grande</button><button class="action" type="button" data-listen>'+icon('sound')+' Escuchar resumen</button></div></div></article></section>'}
    function render(){const p=pages[current];book.innerHTML=p.type==='cover'?cover():p.type==='welcome'?welcome():chapter(p,current);counter.textContent=(current+1)+' / '+pages.length;progressFill.style.width=((current+1)/pages.length*100)+'%';shortTitle.textContent=p.title;prevBtn.disabled=current===0;nextBtn.disabled=current===pages.length-1;nextBtn.querySelector('.nav-label').textContent=current===pages.length-2?'Finalizar':'Siguiente';history.replaceState(null,'','#pagina-'+(current+1));document.title=p.title+' — La búsqueda de la santidad';updateToc();book.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)));book.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=openZoom);book.querySelectorAll('[data-listen]').forEach(b=>b.onclick=listen)}
    function go(index){if(index<0||index>=pages.length||index===current)return;stopSpeech();const spread=book.firstElementChild;const cls=index>current?'leaving-next':'leaving-prev';spread.classList.add(cls);setTimeout(()=>{current=index;render()},180)}
    function buildToc(){toc.innerHTML=pages.map((p,i)=>'<button type="button" class="toc-item" data-index="'+i+'"><span class="toc-num">'+String(i+1).padStart(2,'0')+'</span><span class="toc-name">'+p.title+'<span class="toc-note">'+(p.chapter||(i===0?'Inicio':'Orientación'))+'</span></span></button>').join('');toc.querySelectorAll('button').forEach(b=>b.onclick=()=>{closeToc();go(Number(b.dataset.index))})}
    function updateToc(){toc.querySelectorAll('.toc-item').forEach((el,i)=>el.classList.toggle('current',i===current))}
    function openToc(){tocOverlay.classList.add('open');tocOverlay.setAttribute('aria-hidden','false');document.getElementById('tocClose').focus()}
    function closeToc(){tocOverlay.classList.remove('open');tocOverlay.setAttribute('aria-hidden','true');document.getElementById('tocBtn').focus()}
    function openZoom(){const p=pages[current];if(!p.image)return;zoom=100;zoomImage.src=p.image;zoomImage.alt='Vista ampliada de '+p.title;zoomTitle.textContent=p.title;applyZoom();zoomDialog.classList.add('open');zoomDialog.setAttribute('aria-hidden','false');zoomStage.scrollTo(0,0);document.getElementById('zoomClose').focus()}
    function closeZoom(){zoomDialog.classList.remove('open');zoomDialog.setAttribute('aria-hidden','true');zoomImage.src=''}
    function applyZoom(){zoomImage.style.width=zoom+'%';document.getElementById('zoomReset').textContent=zoom+'%'}
    function listen(){const p=pages[current];if(!('speechSynthesis'in window)){showToast('La lectura en voz alta no está disponible en este navegador.');return}if(speaking){stopSpeech();showToast('Lectura detenida.');return}const u=new SpeechSynthesisUtterance(p.title+'. '+p.summary+'. Para reflexionar: '+p.question);u.lang='es-MX';u.rate=.88;u.onend=()=>speaking=false;u.onerror=()=>speaking=false;speaking=true;speechSynthesis.speak(u);showToast('Leyendo el resumen en voz alta…')}
    function stopSpeech(){if('speechSynthesis'in window)speechSynthesis.cancel();speaking=false}
    function showToast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove('show'),2600)}
    prevBtn.onclick=()=>go(current-1);nextBtn.onclick=()=>go(current+1);document.getElementById('tocBtn').onclick=openToc;document.getElementById('tocClose').onclick=closeToc;tocOverlay.onclick=e=>{if(e.target===tocOverlay)closeToc()};
    document.getElementById('fontBtn').onclick=()=>{fontStep=(fontStep+1)%3;document.documentElement.style.setProperty('--base-size',[18,20,22][fontStep]+'px');showToast(['Tamaño normal','Texto grande','Texto muy grande'][fontStep])};
    document.getElementById('fullscreenBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
    document.getElementById('zoomClose').onclick=closeZoom;document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(220,zoom+25);applyZoom()};document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(75,zoom-25);applyZoom()};document.getElementById('zoomReset').onclick=()=>{zoom=100;applyZoom();zoomStage.scrollTo(0,0)};
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(zoomDialog.classList.contains('open'))closeZoom();else if(tocOverlay.classList.contains('open'))closeToc();return}if(zoomDialog.classList.contains('open')||tocOverlay.classList.contains('open'))return;if(e.key==='ArrowRight'||e.key==='PageDown')go(current+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(current-1)});
    let touchStart=0;book.addEventListener('touchstart',e=>touchStart=e.changedTouches[0].clientX,{passive:true});book.addEventListener('touchend',e=>{const delta=e.changedTouches[0].clientX-touchStart;if(Math.abs(delta)>70)go(current+(delta<0?1:-1))},{passive:true});
    const hash=Number(location.hash.replace('#pagina-',''))-1;if(Number.isInteger(hash)&&hash>=0&&hash<pages.length)current=hash;buildToc();render();
  </script>
</body>
</html>
